name: IQAM Dashboard Update

on:
  push:
    branches: [main]
    paths:
      - "dashboard_update.py"
  schedule:
    - cron: "0 5 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: full (Fondsdaten+News), news (nur News), backfill (Historische Holdings)'
        required: false
        default: 'full'
        type: choice
        options: [full, news, backfill]

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install openpyxl msal --quiet

      - name: Bestimme Run-Mode
        id: mode
        run: |
          DAY=$(date -u +%-d)
          EVENT="${{ github.event_name }}"
          MANUAL_MODE="${{ github.event.inputs.run_mode }}"
          if [ "$EVENT" = "schedule" ] && [ "$DAY" -le 3 ]; then
            echo "run_mode=full" >> $GITHUB_OUTPUT
            echo "→ Monatsanfang (Tag $DAY): automatisch full-Mode"
          elif [ "$EVENT" = "schedule" ]; then
            echo "run_mode=news" >> $GITHUB_OUTPUT
          else
            echo "run_mode=${MANUAL_MODE:-full}" >> $GITHUB_OUTPUT
          fi

      - name: Dashboard aktualisieren
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.run_mode }}
        run: python dashboard_update.py

      - name: Job Summary
        if: always()
        run: |
          echo "## IQAM Dashboard Update" >> $GITHUB_STEP_SUMMARY
          echo "| Feld | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Datum | $(date -u '+%d.%m.%Y %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Modus | ${{ steps.mode.outputs.run_mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | https://nicolasferschen-art.github.io/sunrise-dashboard/ |" >> $GITHUB_STEP_SUMMARYname: IQAM Dashboard Update

on:
  push:
    branches: [main]
    paths:
      - "dashboard_update.py"
  schedule:
    - cron: "0 5 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode: full (Fondsdaten+News), news (nur News), backfill (Historische Holdings)'
        required: false
        default: 'full'
        type: choice
        options: [full, news, backfill]

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install openpyxl msal --quiet

      - name: Dashboard aktualisieren
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'news' || github.event.inputs.run_mode || 'news' }}
        run: python dashboard_update.py

      - name: Job Summary
        if: always()
        run: |
          echo "## IQAM Dashboard Update" >> $GITHUB_STEP_SUMMARY
