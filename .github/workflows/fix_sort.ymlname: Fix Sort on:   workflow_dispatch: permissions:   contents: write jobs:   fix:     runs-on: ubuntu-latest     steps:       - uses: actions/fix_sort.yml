name: Fix Sort
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "import base64,os; c=open('dashboard_update.py').read(); c=c.replace(base64.b64decode(os.environ['S1_OLD']).decode(),base64.b64decode(os.environ['S1_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['S2_OLD']).decode(),base64.b64decode(os.environ['S2_NEW']).decode(),1); open('dashboard_update.py','w').write(c)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dashboard_update.py
          git commit -m "Fix: sort news by date"
          git push
        env:
          S1_OLD: ${{ vars.S1_OLD }}
          S1_NEW: ${{ vars.S1_NEW }}
          S2_OLD: ${{ vars.S2_OLD }}
          S2_NEW: ${{ vars.S2_NEW }}
