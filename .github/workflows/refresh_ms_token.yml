name: Refresh MS Token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install msal
        run: pip install msal

      - name: Device Code Flow und Token setzen
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import msal, sys, subprocess, os

          client_id = os.environ['MS_CLIENT_ID']
          tenant_id = os.environ['MS_TENANT_ID']
          repo = os.environ['GITHUB_REPOSITORY']

          app = msal.PublicClientApplication(
              client_id,
              authority=f'https://login.microsoftonline.com/{tenant_id}'
          )

          scopes = ['https://graph.microsoft.com/Mail.Read', 'offline_access']
          flow = app.initiate_device_flow(scopes=scopes)
          if 'user_code' not in flow:
              print('FEHLER beim Device Flow:', flow)
              sys.exit(1)

          print()
          print('======================================')
          print('MICROSOFT LOGIN ERFORDERLICH')
          print(f'URL:  {flow["verification_uri"]}')
          print(f'CODE: {flow["user_code"]}')
          print('======================================')
          print()
          sys.stdout.flush()

          print('Warte auf Authentifizierung (max. 15 Min)...')
          result = app.acquire_token_by_device_flow(flow)

          if 'refresh_token' not in result:
              print('FEHLER:', result.get('error_description', str(result)))
              sys.exit(1)

          refresh_token = result['refresh_token']
          print('Refresh Token erhalten! Setze GitHub Secret...')

          proc = subprocess.run(
              ['gh', 'secret', 'set', 'MS_REFRESH_TOKEN',
               '--repo', repo, '--body', refresh_token],
              capture_output=True, text=True
          )
          if proc.returncode != 0:
              print('FEHLER gh secret set:', proc.stderr)
              print('Bitte Token manuell als GitHub Secret setzen!')
              sys.exit(1)

          print('MS_REFRESH_TOKEN erfolgreich aktualisiert!')
          EOF
