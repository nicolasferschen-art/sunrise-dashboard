name: Fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show bb7e10b:dashboard_update.py > dashboard_update.py
          sed -i 's/max_summaries=10, max_wall_seconds=240/max_summaries=25, max_wall_seconds=240/' dashboard_update.py
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dashboard_update.py
          git commit -m "Fix: restore dashboard_update.py from bb7e10b + max_summaries=25"
          git push
