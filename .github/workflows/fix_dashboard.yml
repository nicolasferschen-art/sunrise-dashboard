name: Fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show bb7e10b:dashboard_update.py > dashboard_update.py
          python3 -c "import base64,os; c=open('dashboard_update.py').read(); c=c.replace(base64.b64decode(os.environ['P1_OLD']).decode(),base64.b64decode(os.environ['P1_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['P2_OLD']).decode(),base64.b64decode(os.environ['P2_NEW']).decode(),1); c=c.replace('max_summaries=10, max_wall_seconds=240','max_summaries=25, max_wall_seconds=240',1); c=c.replace(base64.b64decode(os.environ['S1_OLD']).decode(),base64.b64decode(os.environ['S1_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['S2_OLD']).decode(),base64.b64decode(os.environ['S2_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['F1_OLD']).decode(),base64.b64decode(os.environ['F1_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['F2_OLD']).decode(),base64.b64decode(os.environ['F2_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['M1_OLD']).decode(),base64.b64decode(os.environ['M1_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['M2_OLD']).decode(),base64.b64decode(os.environ['M2_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['M3_OLD']).decode(),base64.b64decode(os.environ['M3_NEW']).decode(),1); c=c.replace(base64.b64decode(os.environ['M4_OLD']).decode(),base64.b64decode(os.environ['M4_NEW']).decode(),1); open('dashboard_update.py','w').write(c)"
          git config user.email "github-actions[bt]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dashboard_update.py
          git commit -m "Fix: apply all patches to dashboard_update.py"
          git push
        env:
          P1_OLD: ${{ vars.P1_OLD }}
          P1_NEW: ${{ vars.P1_NEW }}
          P2_OLD: ${{ vars.P2_OLD }}
          P2_NEW: ${{ vars.P2_NEW }}
          S1_OLD: ${{ vars.S1_OLD }}
          S1_NEW: ${{ vars.S1_NEW }}
          S2_OLD: ${{ vars.S2_OLD }}
          S2_NEW: ${{ vars.S2_NEW }}
          F1_OLD: ${{ vars.F1_OLD }}
          F1_NEW: ${{ vars.F1_NEW }}
          F2_OLD: ${{ vars.F2_OLD }}
          F2_NEW: ${{ vars.F2_NEW }}
          M1_OLD: ${{ vars.M1_OLD }}
          M1_NEW: ${{ vars.M1_NEW }}
          M2_OLD: ${{ vars.M2_OLD }}
          M2_NEW: ${{ vars.M2_NEW }}
          M3_OLD: ${{ vars.M3_OLD }}
          M3_NEW: ${{ vars.M3_NEW }}
          M4_OLD: ${{ vars.M4_OLD }}
          M4_NEW: ${{ vars.M4_NEW }}
